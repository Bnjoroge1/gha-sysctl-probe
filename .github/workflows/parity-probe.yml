name: hosted runtime parity probe

on:
  workflow_dispatch:
    inputs:
      label:
        description: label for this run
        required: false
        default: manual

permissions:
  contents: read

jobs:
  probe:
    name: probe ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: runtime probe
        run: |
          echo "=== uname"; uname -a
          echo "=== hostname"; hostname; hostname -I 2>/dev/null || true
          echo "=== /proc/self/limits"; cat /proc/self/limits
          echo "=== ulimit -a"; ulimit -a
          echo "=== stack/nofile pairs"
          printf 'stack soft=%s hard=%s\n' "$(ulimit -Ss)" "$(ulimit -Hs)"
          printf 'nofile soft=%s hard=%s\n' "$(ulimit -Sn)" "$(ulimit -Hn)"
          printf 'nproc soft=%s hard=%s\n' "$(ulimit -Su)" "$(ulimit -Hu)"
          echo "=== sysctls"
          for k in vm.max_map_count fs.inotify.max_user_watches fs.inotify.max_user_instances; do
            printf '%s=%s\n' "$k" "$(cat "/proc/sys/${k//./\/}" 2>/dev/null || echo MISSING)"
          done
          echo "=== hostname resolution"
          getent hosts "$(hostname)" || echo "getent hosts rc=$?"
          getent ahostsv4 "$(hostname)" || echo "getent ahostsv4 rc=$?"
          echo "=== local addresses"
          ip -o -4 addr show || true
          echo "=== env"
          env | sort | grep -E '^(TERM|COLORTERM|CI|GITHUB_ACTIONS|RUNNER_OS)=' || echo "(none of TERM/COLORTERM/CI/GITHUB_ACTIONS)"
          echo "=== TERM via sh -lc and bash -lc"
          printf 'sh -lc TERM=[%s]\n' "$(sh -lc 'printf %s "$TERM"' 2>/dev/null || echo unset)"
          printf 'bash -lc TERM=[%s]\n' "$(bash -lc 'printf %s "$TERM"' 2>/dev/null || echo unset)"
          echo "=== hosted image version"; grep -E '^(ImageVersion|ImageOS)=' /etc/environment 2>/dev/null || true
      - name: pydantic-shaped deep recursion probe
        run: |
          python3 -m pip install --quiet --disable-pip-version-check pydantic-core
          python3 - <<'PY'
          import pydantic_core as pc
          from pydantic_core import core_schema

          s = pc.SchemaSerializer(
              core_schema.any_schema(
                  serialization=core_schema.plain_serializer_function_ser_schema(
                      lambda value: s.to_python(value)
                  )
              )
          )
          for mode in ("python", "json"):
              try:
                  if mode == "python":
                      s.to_python(42)
                  else:
                      s.to_json(42)
              except pc.PydanticSerializationError as exc:
                  print(f"to_{mode}: PydanticSerializationError: {exc}")
              except RecursionError as exc:
                  print(f"to_{mode}: bare RecursionError (unexpected shape): {exc}")
              else:
                  raise SystemExit(f"to_{mode}: no recursion error — probe did not recurse")
          print("recursion probe OK: RecursionError, no SIGSEGV")
          PY

  container-probe:
    name: container probe ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    container: node:20-bookworm
    steps:
      - name: container runtime probe
        run: |
          echo "=== uname"; uname -a
          echo "=== hostname"; hostname; hostname -I 2>/dev/null || true
          echo "=== /proc/self/limits"; cat /proc/self/limits
          echo "=== ulimit -a"; ulimit -a
          printf 'stack soft=%s hard=%s\n' "$(ulimit -Ss)" "$(ulimit -Hs)"
          printf 'nofile soft=%s hard=%s\n' "$(ulimit -Sn)" "$(ulimit -Hn)"
          echo "=== sysctls"
          for k in vm.max_map_count fs.inotify.max_user_watches fs.inotify.max_user_instances; do
            printf '%s=%s\n' "$k" "$(cat "/proc/sys/${k//./\/}" 2>/dev/null || echo MISSING)"
          done
          echo "=== hostname resolution"
          getent hosts "$(hostname)" || echo "getent hosts rc=$?"
          echo "=== env"
          env | sort | grep -E '^(TERM|COLORTERM|CI|GITHUB_ACTIONS)=' || echo "(none of TERM/COLORTERM/CI/GITHUB_ACTIONS)"

  docker-probe:
    name: docker run probe ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      - name: ad-hoc docker run
        run: |
          docker run --rm ubuntu:24.04 bash -c '
            echo "=== /proc/self/limits"; cat /proc/self/limits
            printf "stack soft=%s hard=%s\n" "$(ulimit -Ss)" "$(ulimit -Hs)"
            printf "nofile soft=%s hard=%s\n" "$(ulimit -Sn)" "$(ulimit -Hn)"
            for k in vm.max_map_count fs.inotify.max_user_watches fs.inotify.max_user_instances; do
              printf "%s=%s\n" "$k" "$(cat "/proc/sys/${k//./\/}" 2>/dev/null || echo MISSING)"
            done
            echo "=== env"; env | sort | grep -E "^(TERM|COLORTERM|CI|GITHUB_ACTIONS)=" || echo "(no TERM/COLORTERM/CI/GITHUB_ACTIONS)"
          '
