name: rust-env-probe
on: workflow_dispatch
jobs:
  probe:
    strategy:
      matrix:
        os: [ubuntu-24.04-arm, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    steps:
      - name: env and paths
        run: |
          echo "ImageVersion=$ImageVersion"
          echo "--- step env"; env | grep -E '^(CARGO_HOME|RUSTUP_HOME|PATH|HOME)=' || true
          echo "--- /etc/environment"; cat /etc/environment
          echo "--- profile.d"; grep -rnE 'CARGO|RUSTUP' /etc/profile.d /etc/bash.bashrc /home/runner/.profile /home/runner/.bashrc 2>/dev/null || echo none
          echo "--- which"; command -v cargo rustup rustc
          echo "--- rustup show home"; rustup show home 2>&1 || true
          echo "--- dirs"; ls -ld /usr/local/rustup /usr/local/cargo /home/runner/.cargo /home/runner/.rustup /etc/skel/.cargo /etc/skel/.rustup 2>&1
          stat -c '%U:%G %a %n' /home/runner/.cargo/bin/cargo /home/runner/.cargo/bin/rustup 2>&1
